name: Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform:
        required: true
        type: string
      version_label:
        required: true
        type: string
      upload_artifact:
        required: false
        type: boolean
        default: false
      fetch_changelog:
        required: false
        type: boolean
        default: false
      notarize:
        description: Submit the signed macOS app to Apple's notary service (requires signing secrets)
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE_P12:
        description: Base64-encoded Developer ID Application certificate (.p12)
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false

jobs:
  build:
    name: Build (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libsndfile1 ffmpeg xvfb xauth dbus-daemon
          /usr/bin/python3 -m venv --system-site-packages .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Python
        if: inputs.platform != 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ inputs.platform }}" = "linux" ]; then
            pip install -r packaging/linux/requirements.txt -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi

      - name: Set version in version file
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          python packaging/set_build_version.py

      - name: Ensure changelog file exists
        if: ${{ !inputs.fetch_changelog }}
        shell: bash
        run: |
          echo "No release changelog for this build." > LATEST_CHANGELOG.md

      - name: Fetch latest release changelog
        if: ${{ inputs.fetch_changelog }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --json body --jq '.body' > LATEST_CHANGELOG.md || echo "No previous release notes found." > LATEST_CHANGELOG.md
          echo "Changelog fetched successfully:"
          cat LATEST_CHANGELOG.md
          echo "----- End of Changelog -----"

      - name: Import macOS signing certificate
        if: ${{ inputs.platform == 'macos' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "MACOS_CERTIFICATE_P12 secret not available; building unsigned."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "No 'Developer ID Application' identity found in the imported certificate."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "MACOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Linux source checks
        if: inputs.platform == 'linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q 2>&1 | tee artifacts/linux-tests.log
          python packaging/linux/smoke.py "$PWD/.venv/bin/python" "$PWD/main.py" 2>&1 | tee artifacts/linux-source.log

      - name: Build (build.py)
        shell: bash
        env:
          APPLE_ID: ${{ inputs.notarize && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ inputs.notarize && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.notarize && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          python build.py 2>&1 | tee artifacts/build.log

      - name: Linux archive and frozen smoke test
        if: inputs.platform == 'linux'
        shell: bash
        env:
          VERSION_LABEL: ${{ inputs.version_label }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          set -o pipefail
          ARCHIVE="$PWD/artifacts/op-1z-sample-manager-linux-x86_64-${VERSION_LABEL//\//-}.tar.gz"
          tar -czf "$ARCHIVE" -C dist 'OP-1Z Sample Manager'
          EXTRACT_DIR=$(mktemp -d)
          trap 'rm -rf "$EXTRACT_DIR"' EXIT
          tar -xzf "$ARCHIVE" -C "$EXTRACT_DIR"
          env -u PYTHONPATH -u VIRTUAL_ENV PATH=/usr/bin:/bin /usr/bin/python3 packaging/linux/smoke.py "$EXTRACT_DIR/OP-1Z Sample Manager/OP-1Z Sample Manager" 2>&1 | tee artifacts/linux-frozen.log
          sha256sum "$ARCHIVE" > artifacts/linux-sha256.txt

      - name: Upload Linux diagnostics
        if: always() && inputs.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-diagnostics-${{ inputs.version_label }}
          path: |
            artifacts/*.log
            artifacts/linux-sha256.txt
            build/**/warn-*.txt

      - name: Remove signing keychain
        if: ${{ always() && env.SIGNING_KEYCHAIN_PATH != '' }}
        shell: bash
        run: |
          security delete-keychain "$SIGNING_KEYCHAIN_PATH"

      - name: Package artifact
        if: ${{ inputs.upload_artifact && inputs.platform != 'linux' }}
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          VERSION_LABEL: ${{ inputs.version_label }}
        run: |
          ARTIFACT="op-1z-sample-manager-$PLATFORM-$VERSION_LABEL"
          mkdir -p artifacts
          if [ ! -d "dist" ]; then
            echo "dist/ not found; build likely failed."
            exit 1
          fi
          if [ "$PLATFORM" = "macos" ]; then
            # ditto keeps symlinks and resource forks intact; other archivers
            # break the code signature and notarization ticket.
            ditto -c -k --keepParent --sequesterRsrc \
              "dist/OP-1Z Sample Manager.app" "artifacts/${ARTIFACT}.zip"
          else
            cd dist
            if command -v 7z >/dev/null 2>&1; then
              7z a "../artifacts/${ARTIFACT}.zip" .
            else
              zip -r "../artifacts/${ARTIFACT}.zip" .
            fi
            cd ..
          fi

      - name: Upload build artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: op-1z-sample-manager-${{ inputs.platform }}-${{ inputs.version_label }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
